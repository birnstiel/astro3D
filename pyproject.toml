[build-system]
build-backend = 'mesonpy'
requires = ['meson-python', 'numpy']

[project]
name = 'astro3d'
version = '2.0.0.dev0'
description = 'Package for Polyjet Printing methods in astrophysics and beyond'
readme = { file = 'README.md', content-type = 'text/markdown' }
authors = [
    { name = "Til Birnstiel", email = "til.birnstiel@lmu.de" },
]
license = { file = 'LICENSE' }
requires-python = '>=3.10'
dependencies = ['numpy', 'scipy', 'matplotlib', 'tqdm', 'scikit-image', 'Pillow', 'imageio', 'pooch']

[tool.pytest.ini_options]
testpaths = ['tests']
markers = [
    'network: needs internet access to download data (deselect with -m "not network")',
]

[project.urls]
Repository = "https://github.com/birnstiel/astro3D"
